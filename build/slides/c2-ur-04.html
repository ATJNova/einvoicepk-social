<!doctype html><html lang="ur"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-light lang-ur">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="stepnum">03</div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:44px;">
      <div class="gap-m">
        <div class="eyebrow">Step 03 — Submit</div>
        <h2 class="display h-step">جمع کریں اور<br>IRN + QR لیں</h2>
        <p class="lead">Submit دبائیں۔ ایف بی آر فوراً انوائس نمبر اور کیو آر کوڈ بھیج دیتا ہے — سیدھا بل پر۔</p>
      </div>
      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">FBR RESPONSE</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> Accepted</span>
        </div>
        <div class="mock-row"><span>IRN</span><b>7000241180105</b></div>
        <div class="mock-row"><span>QR code</span><b>Generated</b></div>
        <div class="mock-row"><span>Status</span><b>Accepted by FBR</b></div>
        <div class="mock-total"><span>Time</span><b class="grad">~ 2 sec</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">آگے
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>04</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
