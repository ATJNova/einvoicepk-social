<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;background:#1A3A7C;
  font-family:'Geist',sans-serif;display:flex;flex-direction:column;padding:74px 76px 64px}
.ph{display:flex;align-items:center;justify-content:space-between}
.lc{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:11px 18px;display:flex}.lc img{height:42px;display:block}
.fb{display:inline-flex;align-items:center;gap:8px;font-family:'Geist Mono',monospace;font-size:14px;color:#3BD968;
  background:rgba(59,217,104,.12);border:1px solid rgba(59,217,104,.3);padding:8px 14px;border-radius:999px}
.fb .d{width:8px;height:8px;border-radius:50%;background:#3BD968}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
.label{font-family:'Geist Mono',monospace;font-size:22px;letter-spacing:.2em;color:#3BD968;font-weight:600}
.big{font-size:160px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#ffffff}
.unit{font-size:52px;font-weight:800;color:#ffffff;opacity:.6;margin-top:-8px}
.line{font-size:46px;font-weight:700;color:#ffffff;line-height:1.3}
.line .g{color:#3BD968}
.bar{width:100%;height:6px;background:#3BD968;border-radius:99px;margin:8px 0}
.sub{font-size:30px;color:rgba(255,255,255,.65);line-height:1.5}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:1px solid rgba(255,255,255,.12);
  font-family:'Geist Mono',monospace;font-size:22px;color:rgba(255,255,255,.5)}
.foot .wa{color:#3BD968;font-weight:600}
</style></head>
<body><div class="slide">
<div class="ph">
  <span class="lc"><img src="../assets/logo-trimmed.png" alt="einvoicepk"></span>
  <span class="fb"><span class="d"></span> FBR INTEGRATED</span>
</div>
<div class="body">
  <div class="label">PENALTY · FIRST DEFAULT</div>
  <div class="big">5 LAkh</div>
  <div class="unit">Rs 5,00,000</div>
  <div class="bar"></div>
  <div class="line">Sirf ek <span class="g">ghalat invoice</span><br>ke liye.</div>
  <p class="sub">Digital invoice nahi? FBR penalty aati hai.<br>einvoicepk — 3 minute mein compliant invoice.</p>
</div>
<div class="foot"><span>einvoicepk.com</span><span class="wa">💬 0325-4180105</span></div>
</div></body></html>
