<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-dark">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="stepnum">02</div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:44px;">
      <div class="gap-m">
        <div class="eyebrow">Step 02 — Paste it in</div>
        <h2 class="display h-step">Paste it into<br>einvoicepk</h2>
        <p class="lead">Open Settings → Integration, paste your PRAL token and choose sandbox or production. Save.</p>
      </div>
      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">SETTINGS · INTEGRATION</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> Saved</span>
        </div>
        <div class="mock-row"><span>PRAL token</span><b>Connected</b></div>
        <div class="mock-row"><span>Environment</span><b>Sandbox</b></div>
        <div class="mock-row"><span>Auto-submit</span><b>On</b></div>
        <div class="mock-total"><span>Step</span><b class="grad">2 of 3</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">Next
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>03</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
