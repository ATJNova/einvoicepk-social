<!doctype html><html lang="ur"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-light lang-ur">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:40px;">
      <div class="gap-s">
        <div class="eyebrow">پابندی اور رفتار</div>
        <h2 class="display h-step" style="font-size:64px;">ہر بل قواعد کے مطابق</h2>
      </div>
      <div class="cards">
        <div class="card big">
          <div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h3>ہمیشہ ایف بی آر کے مطابق</h3>
          <p>ہر انوائس ایف بی آر کے ڈیجیٹل اصولوں پر پورا — IRN اور QR شامل۔</p>
        </div>
        <div class="card big">
          <div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
          <h3>فوری ارسال</h3>
          <p>بل بنتے ہی ایف بی آر کو پہنچ جاتا ہے۔ کوئی دستی فائلنگ نہیں۔</p>
        </div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">آگے
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>02</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
