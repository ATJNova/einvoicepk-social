<!doctype html><html lang="ur"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-light lang-ur">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>

        <div class="eyebrow">Step 01 — Get token</div>
        <h2 class="display h-step">PRAL ٹوکن<br>حاصل کریں</h2>

      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">FBR IRIS PORTAL</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> Issued</span>

        <div class="mock-row"><span>Source</span><b>IRIS → Digital Invoicing</b></div>
        <div class="mock-row"><span>Token</span><b>PRAL-•••• 4180</b></div>
        <div class="mock-row"><span>Valid</span><b>Active</b></div>
        <div class="mock-total"><span>Step</span><b class="grad">1 of 3</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">آگے
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>02</b> / 05</span>
    </div>
  </div>
