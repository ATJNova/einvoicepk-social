<!doctype html><html lang="ur"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-light lang-ur">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="stepnum">03</div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:44px;">
      <div class="gap-m">
        <div class="eyebrow">Step 03 — Connect FBR</div>
        <h2 class="display h-step">ایف بی آر سسٹم<br>سے جوڑیں</h2>
        <p class="lead">اپنا ایف بی آر سینڈ باکس جوڑیں، ٹیسٹ انوائس بھیجیں، پھر ایک کلک میں پروڈکشن پر آ جائیں۔</p>
      </div>
      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">FBR ENVIRONMENT</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> Live</span>
        </div>
        <div class="mock-row"><span>Sandbox</span><b>Connected</b></div>
        <div class="mock-row"><span>Test invoice</span><b>Accepted</b></div>
        <div class="mock-row"><span>Mode</span><b>Production</b></div>
        <div class="mock-total"><span>You are</span><b class="grad">Live</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">آگے
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>04</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
