<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-dark">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="stepnum">02</div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:44px;">
      <div class="gap-m">
        <div class="eyebrow">Step 02 — Add items</div>
        <h2 class="display h-step">Add items, tax<br>auto-calculates</h2>
        <p class="lead">Add products or services. Sales tax, withholding and totals are worked out for you.</p>
      </div>
      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">LINE ITEMS</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> 3 items</span>
        </div>
        <div class="mock-row"><span>Goods (net)</span><b>Rs 100,000</b></div>
        <div class="mock-row"><span>Sales tax 18%</span><b>Rs 18,000</b></div>
        <div class="mock-row"><span>Withholding</span><b>Rs 0</b></div>
        <div class="mock-total"><span>Total</span><b class="grad">Rs 118,000</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">Next
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>03</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
