<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-dark">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="frame">
    <div class="head">
      <div class="brand"><span class="logo-chip"><img src="../assets/logo-trimmed.png" alt="einvoicepk.com"></span></div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>
    <div class="stepnum">02</div>
    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:44px;">
      <div class="gap-m">
        <div class="eyebrow">Step 02 — Tax profile</div>
        <h2 class="display h-step">Add your NTN<br>&amp; STRN</h2>
        <p class="lead">Enter your tax registration once. We verify it with FBR automatically — no paperwork, no waiting.</p>
      </div>
      <div class="mock">
        <div class="mock-top">
          <span class="mock-id">TAX PROFILE</span>
          <span class="mock-badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green-bright);display:inline-block"></span> Verified</span>
        </div>
        <div class="mock-row"><span>NTN</span><b>1234567-8</b></div>
        <div class="mock-row"><span>STRN</span><b>03-21-9999-001-23</b></div>
        <div class="mock-row"><span>FBR check</span><b>Passed</b></div>
        <div class="mock-total"><span>Status</span><b class="grad">Verified</b></div>
      </div>
    </div>
    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">Next
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>03</b> / 05</span>
    </div>
  </div>
</div>
</body></html>
