<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide theme-dark">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>

  <div class="frame">
    <div class="head">
      <div class="brand">
        <img src="../assets/einvoicepk-mark.svg" alt="">
        <div>
          <div class="brand-name">einvoice<span class="pk">pk</span></div>
          <div class="brand-tag">FBR Digital Invoicing</div>
        </div>
      </div>
      <div class="fbr-chip"><span class="dot"></span> FBR INTEGRATED</div>
    </div>

    <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:38px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:40px;">

          <h1 class="display h-cover">Create your account &amp;<br>go <span class="grad">live with FBR</span></h1>

        <div style="width:220px;height:220px;flex:none;margin-top:8px;">

            <circle class="seal-ring" cx="60" cy="60" r="53"/>
            <circle class="seal-ring seal-ring-i" cx="60" cy="60" r="47"/>
            <text class="seal-text"><textPath href="#sealcurve" startOffset="0">· FBR DIGITAL INVOICING · VERIFIED · COMPLIANT </textPath></text>
            <path class="seal-check" d="M43 61 l12 12 l23 -27"/>
          </svg>
        </div>
      </div>
      <p class="lead">Set up your einvoicepk workspace, connect to FBR&rsquo;s digital invoicing system, and issue your first <strong>tax-compliant invoice</strong> — in under 10 minutes.</p>
    </div>

    <div class="foot">
      <span class="site">einvoicepk.com</span>
      <span class="swipe">Swipe to start
        <svg viewBox="0 0 30 14" fill="none"><path d="M1 7h26M21 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="idx"><b>01</b> / 05</span>
    </div>
  </div>
</div>
