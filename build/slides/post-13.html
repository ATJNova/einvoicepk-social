<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;background:#ffffff;
  font-family:'Geist',sans-serif;display:flex;flex-direction:column;padding:74px 76px 64px}
.ph{display:flex;align-items:center;justify-content:space-between}
.lc{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:11px 18px;display:flex}.lc img{height:42px;display:block}
.fb{display:inline-flex;align-items:center;gap:8px;font-family:'Geist Mono',monospace;font-size:14px;color:#1E8538;
  background:rgba(40,167,69,.1);border:1px solid #cdead5;padding:8px 14px;border-radius:999px}
.fb .d{width:8px;height:8px;border-radius:50%;background:#28A745}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0}
.tag{font-family:'Geist Mono',monospace;font-size:22px;letter-spacing:.2em;color:#28A745;font-weight:600;margin-bottom:18px}
.big{font-size:130px;font-weight:900;line-height:.95;letter-spacing:-.04em;color:#1A3A7C;margin-bottom:8px}
.big .g{color:#28A745}
.mid{font-size:50px;font-weight:800;color:#0F172A;line-height:1.2;margin-bottom:36px}
.strip{background:#1A3A7C;border-radius:20px;padding:32px 36px;margin-bottom:32px}
.strip p{font-size:32px;font-weight:700;color:#fff;line-height:1.5}
.strip p span{color:#3BD968}
.steps{display:flex;gap:0;margin-bottom:0}
.step{flex:1;text-align:center;padding:20px 10px;border-right:2px solid #E2E8F0}
.step:last-child{border-right:none}
.step .n{font-family:'Geist Mono',monospace;font-size:40px;font-weight:800;color:#28A745}
.step p{font-size:21px;font-weight:600;color:#475569;margin-top:4px;line-height:1.3}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:1px solid #E2E8F0;
  font-family:'Geist Mono',monospace;font-size:22px;color:#64748B}
.foot .wa{color:#1E8538;font-weight:600}
</style></head>
<body><div class="slide">
<div class="ph">
  <span class="lc"><img src="../assets/logo-trimmed.png" alt="einvoicepk"></span>
  <span class="fb"><span class="d"></span> FBR INTEGRATED</span>
</div>
<div class="body">
  <div class="tag">ITNA ASAAN HAI</div>
  <div class="big"><span class="g">3</span><br>min.</div>
  <div class="mid">mein FBR invoice —<br>IRN + QR sab.</div>
  <div class="strip">
    <p>Signup karein → Items dalein → Submit karein.<br><span>Bas. Koi developer nahi. Koi complication nahi.</span></p>
  </div>
  <div class="steps">
    <div class="step"><div class="n">1</div><p>Sign up<br>Free</p></div>
    <div class="step"><div class="n">2</div><p>Items<br>add karein</p></div>
    <div class="step"><div class="n">3</div><p>Submit<br>→ IRN + QR</p></div>
  </div>
</div>
<div class="foot"><span>einvoicepk.com</span><span class="wa">💬 0325-4180105</span></div>
</div></body></html>
